pluginManagement {
	apply from: 'https://raw.githubusercontent.com/nokeedev/nokeebuild-plugins/refs/heads/main/init.gradle'
}

plugins {
	id 'nokeebuild.develocity'
	id 'nokeebuild.source-control-management'
	id 'nokeebuild.repositories' // TODO: We should have repositories for plugins vs lib, this is lib project
}

rootProject.name = 'commons-exemplar'

sourceControlManagement {
	gitRepository(uri('https://github.com/nokeedev/nokee-source-elements'))
}
