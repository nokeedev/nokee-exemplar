name: CI

on: push

env:
    DEVELOCITY_ACCESS_KEY: ${{ secrets.BUILD_SCAN_ACCESS_KEY }}

jobs:
    test:
        runs-on: ubuntu-26.04
        steps:
            -   uses: actions/checkout@v7
            -   uses: actions/setup-java@v6
                with:
                    distribution: temurin
                    java-version: 21
            -   uses: gradle/actions/setup-gradle@v6
            -   run: ./gradlew check --no-daemon "-Dgradle.enterprise.url=https://community.develocity.cloud/" "-Ddevelocity.deprecation.captureOrigin=true"
